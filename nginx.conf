server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # k8s health probe
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # /hyperout -> /hyperout/ so the game's index resolves
    location = /hyperout { return 301 /hyperout/; }
    # /godspeed -> /godspeed/ so the game's index resolves
    location = /godspeed { return 301 /godspeed/; }

    # portal + games (static). The HTML entry always revalidates so redeploys
    # are picked up immediately.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # retro-themed 404
    error_page 404 /404.html;

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Code + markup: cache but always revalidate (304 if unchanged) → no stale
    # assets after a redeploy, minimal bandwidth.
    location ~* \.(html|js|css|svg)$ {
        add_header Cache-Control "no-cache";
    }
    # Images/fonts: short cache with revalidation.
    location ~* \.(png|jpg|jpeg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }
    # Audio: large and rarely changes.
    location ~* \.(mp3|wav)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
