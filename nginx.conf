server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # k8s health probe
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # /hyperout -> /hyperout/ so the game's index resolves
    location = /hyperout { return 301 /hyperout/; }

    # portal + games (static)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # cache static assets; html stays fresh
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location ~* \.(mp3|wav)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
