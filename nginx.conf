server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Required so the /api/debris/ proxy_pass below (a variable target,
    # not a bare hostname - see that block's comment for why) resolves
    # DNS at *request* time, not once at nginx startup. __COREDNS_IP__ is
    # substituted at container startup (see the Dockerfile's
    # docker-entrypoint.d script) with the nameserver IP Kubernetes
    # already writes into every pod's /etc/resolv.conf - nginx's
    # `resolver` directive needs a real IP, not a hostname (a hostname
    # here would itself need resolving to find the resolver, which is
    # exactly the startup-time chicken-and-egg this whole variable
    # approach exists to avoid).
    resolver __COREDNS_IP__ valid=10s;

    # k8s health probe
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # /hyperout -> /hyperout/ so the game's index resolves
    location = /hyperout { return 301 /hyperout/; }
    # /godspeed -> /godspeed/ so the game's index resolves
    location = /godspeed { return 301 /godspeed/; }
    # /debris -> /debris/ so the game's index resolves
    location = /debris { return 301 /debris/; }

    # Debris's high-score leaderboard API - the one dynamic route on an
    # otherwise fully static site. debris-highscore-api is a separate,
    # single-replica Deployment/Service (k8s/rheinarts.yaml) reached over
    # the cluster network, not a local process - this container never
    # runs any backend code itself.
    #
    # proxy_pass target is a variable ($highscore_upstream), not the
    # bare hostname - found the hard way (a local `docker run` of this
    # exact image) that a literal hostname makes nginx resolve it once
    # at *startup* and refuse to start at all if it doesn't resolve yet
    # (a real risk here: pod startup ordering, or the API Deployment
    # briefly unavailable, would otherwise crash-loop the *entire*
    # portal - HyperOut and Godspeed included - over one game's
    # leaderboard). A variable forces resolution at request time
    # instead: nginx starts regardless, and a request to this one route
    # fails gracefully (502) if the upstream truly isn't reachable,
    # without taking anything else down.
    #
    # That variable target has its own real gotcha, found the hard way
    # too (a live 404 once the API was actually up): nginx's usual
    # "trailing slash on proxy_pass strips the matched location prefix"
    # trick only applies when proxy_pass's target is a literal string -
    # with a variable target, nginx forwards the ORIGINAL, unstripped
    # request URI instead, so the upstream was receiving
    # /api/debris/highscores verbatim and 404ing (it only knows
    # /highscores). `rewrite ... break` strips the prefix itself before
    # proxy_pass runs, independent of whether the target is a variable.
    #
    # And a *third* variant of the same underlying issue (an "invalid
    # URL prefix" 500 on every request, also only caught by actually
    # running two containers together locally): a variable-target
    # proxy_pass with no explicit path at all - `proxy_pass
    # http://$var;` - can't rely on nginx's usual implicit
    # "no URI = pass the original request URI through" behavior either.
    # $uri (rewritten below) has to be spelled out explicitly.
    #
    # And a *fourth*: `set` has to come BEFORE `rewrite ... break` in
    # this block, not after. `break` halts every remaining directive
    # from ngx_http_rewrite_module in the current block - `set` is
    # implemented by that same module, so a `set` placed after `break`
    # never actually runs, leaving $highscore_upstream permanently
    # uninitialized ("using uninitialized ... variable" / "no host in
    # upstream" in the error log - a 500 on every single request).
    location /api/debris/ {
        set $highscore_upstream debris-highscore-api.rheinarts.svc.cluster.local:8081;
        rewrite ^/api/debris/(.*)$ /$1 break;
        proxy_pass http://$highscore_upstream$uri;
        proxy_set_header Host $host;
    }

    # portal + games (static). The HTML entry always revalidates so redeploys
    # are picked up immediately.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # retro-themed 404
    error_page 404 /404.html;

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Code + markup: cache but always revalidate (304 if unchanged) → no stale
    # assets after a redeploy, minimal bandwidth.
    location ~* \.(html|js|css|svg)$ {
        add_header Cache-Control "no-cache";
    }
    # Images/fonts: short cache with revalidation.
    location ~* \.(png|jpg|jpeg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }
    # Audio: large and rarely changes.
    location ~* \.(mp3|wav)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
