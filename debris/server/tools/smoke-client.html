<!doctype html><meta charset="utf-8"><body>
<script>
// Plain-JS client of the dedicated server's wire protocol, deliberately
// independent of the game's own client code. Scenarios (?scenario=):
//   play     N players join, the leader starts, snapshots + input response are checked
//   lobby    lobby rules: leader-only commands, leadership handover, a joiner turned away
//            mid-match, the lobby reopening after the match
//   session  join checks (password, version, malformed), the status query, two players on one PC,
//            a full lobby, input bound to the connection's own slots, reconnect inside the window,
//            takeover by a quick reconnect, and a seat released when the window closes
//            (needs a password set on the server - pass it with --password - and reconnectGraceMs 3000)
//   scoring  one player spins and fires until it scores, then leaves; the match ends, the server posts the
//            score, and smoke-main.js (given --api) checks the real API's online board for it
//   leave    a player chooses to LEAVE mid-match: the seat and ship go at once - unlike a dropped connection,
//            which holds the seat for the reconnect window
//   bot      joins as one more player and leaves ?leaveAfter= ms after the match starts (used by
//            client-e2e-main.js as the opponent that disappears)
const q = new URLSearchParams(location.search);
const URL_ = q.get('url') || 'ws://127.0.0.1:8765';
const SCENARIO = q.get('scenario') || 'play';
const SECONDS = Number(q.get('seconds') || 6);
const PLAYERS = Number(q.get('players') || 1);
const MODE = q.get('mode') || 'cooperative';
const PASSWORD = q.get('password') || '';
const INITIALS = q.get('initials') || 'SMK';
const PROTOCOL_VERSION = 5;
const STUN = q.get('stun') === '1' ? [{ urls: 'stun:stun.l.google.com:19302' }] : [];
const say = (...a) => console.log(...a);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const failures = [];
const check = (cond, msg) => { if (!cond) { failures.push(msg); say(`  FAIL: ${msg}`); } else say(`  ok: ${msg}`); return cond; };

async function waitFor(fn, ms, label) {
  const t0 = performance.now();
  while (performance.now() - t0 < ms) { const v = fn(); if (v) return v; await sleep(50); }
  check(false, `timed out after ${ms}ms waiting for: ${label}`);
  return null;
}

function queryStatus() {
  return new Promise((resolve) => {
    const ws = new WebSocket(URL_);
    const timer = setTimeout(() => { ws.close(); resolve(null); }, 5000);
    ws.onopen = () => ws.send(JSON.stringify({ type: 'debris-status' }));
    ws.onmessage = (e) => { clearTimeout(timer); ws.close(); resolve(JSON.parse(e.data)); };
    ws.onerror = () => { clearTimeout(timer); resolve(null); };
  });
}

class Player {
  constructor(name) {
    this.name = name; this.joined = null; this.lobby = null; this.reject = null; this.token = null;
    this.snaps = 0; this.lastTick = -1; this.regressions = 0; this.states = new Set(); this.types = new Set();
    this.ships = new Map(); // slot -> { first, last }
    this.firstAt = null; this.bytes = 0; this.tLast = null;
    // one-shot effects (sounds, bursts, shake, popups) seen in snapshots
    this.wrecksMax = 0; this.wreckSample = null; this.eventSeen = new Map(); this.eventKinds = new Set(); this.sfxSeen = new Set(); this.musicSeen = new Set(); this.idsAscending = true; this.maxEventId = 0;
  }
  get slots() { return this.joined ? this.joined.slotIndices : []; }
  async connect() {
    const connectionId = crypto.randomUUID();
    this.ws = new WebSocket(URL_);
    this.pc = new RTCPeerConnection({ iceServers: STUN });
    const reliable = this.reliable = this.pc.createDataChannel('reliable');
    const unreliable = this.unreliable = this.pc.createDataChannel('unreliable', { ordered: false, maxRetransmits: 0 });
    const env = (kind, payload) => JSON.stringify({ type: 'debris-signal', connectionId, kind, payload: JSON.stringify(payload) });
    this.pc.onicecandidate = (e) => { if (e.candidate && this.ws.readyState === 1) this.ws.send(env('ice-candidate', e.candidate.toJSON())); };
    this.ws.onopen = async () => { const o = await this.pc.createOffer(); await this.pc.setLocalDescription(o); this.ws.send(env('offer', o)); };
    this.ws.onmessage = async (e) => {
      const m = JSON.parse(e.data);
      if (m.connectionId !== connectionId) return;
      const payload = JSON.parse(m.payload);
      if (m.kind === 'answer') await this.pc.setRemoteDescription(payload);
      else if (m.kind === 'ice-candidate') await this.pc.addIceCandidate(payload);
    };
    reliable.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'debris-joined') { this.joined = m; this.token = m.token; }
      else if (m.type === 'debris-lobby') this.lobby = m;
      else if (m.type === 'debris-reject') this.reject = m;
    };
    unreliable.onmessage = (e) => {
      const s = JSON.parse(e.data);
      if (s.type !== 'debris-snapshot') return;
      const now = performance.now();
      this.firstAt ??= now;
      this.tLast = now; this.snaps += 1; this.bytes += e.data.length;
      if (s.tick <= this.lastTick) this.regressions += 1;
      this.lastTick = Math.max(this.lastTick, s.tick);
      this.states.add(s.state);
      this.musicSeen.add(s.music);
      if ((s.wrecks || []).length > this.wrecksMax) { this.wrecksMax = s.wrecks.length; this.wreckSample = s.wrecks; }
      (s.events || []).forEach((ev) => {
        const seenBefore = this.eventSeen.get(ev.id) || 0;
        this.eventSeen.set(ev.id, seenBefore + 1);
        this.eventKinds.add(ev.kind);
        if (ev.kind === 'sfx') this.sfxSeen.add(ev.sfx);
        if (seenBefore === 0) { if (ev.id <= this.maxEventId - 5) this.idsAscending = false; this.maxEventId = Math.max(this.maxEventId, ev.id); }
      });
      s.entities.forEach((en) => this.types.add(en.type));
      s.ships.forEach((sh) => {
        const rec = this.ships.get(sh.slotIndex) || { first: sh, last: sh };
        rec.last = sh; this.ships.set(sh.slotIndex, rec);
      });
    };
    const open = await waitFor(() => reliable.readyState === 'open' && unreliable.readyState === 'open', 15000, `${this.name}: data channels to open`);
    return !!open;
  }
  sendJoin(over = {}) {
    const localPlayers = over.localPlayers ?? 1;
    const initials = over.initials ?? (localPlayers === 2 ? ['AAA', 'BBB'] : [INITIALS]);
    this.reliable.send(JSON.stringify({ type: 'debris-join', protocolVersion: PROTOCOL_VERSION, password: PASSWORD, localPlayers, initials, ...over }));
  }
  sendRaw(text) { this.reliable.send(text); }
  command(action, extra = {}) { this.reliable.send(JSON.stringify({ type: 'debris-lobby-command', action, ...extra })); }
  startInput(slots = this.slots, claimed = null) {
    this.stopInput();
    this.inputTimer = setInterval(() => {
      if (this.unreliable.readyState !== 'open') return;
      slots.forEach((slot) => this.unreliable.send(JSON.stringify({ type: 'debris-input', slotIndex: claimed ?? slot, turnDirection: 1, isThrusting: true, isFiring: true, isHyperspacing: false })));
    }, 50);
  }
  stopInput() { clearInterval(this.inputTimer); }
  /** Forget where ships were, so `moved` measures from now. */
  baseline() { this.ships.forEach((rec) => { rec.first = rec.last; }); }
  moved(slot) { const r = this.ships.get(slot); return r ? Math.hypot(r.last.x - r.first.x, r.last.y - r.first.y) : 0; }
  close() { this.stopInput(); try { this.ws.close(); this.pc.close(); } catch (e) {} }
}

/** Connect and send a join; resolves once the server has answered (joined or rejected). */
async function join(name, opts = {}) {
  const p = new Player(name);
  await p.connect();
  p.sendJoin(opts);
  await waitFor(() => p.joined || p.reject, 5000, `${name}: joined or reject`);
  return p;
}

// ------------------------------------------------------------------
async function scenarioPlay() {
  say(`play: ${PLAYERS} player(s) -> ${URL_}, mode ${MODE}, collecting ${SECONDS}s`);
  const players = [];
  for (let i = 0; i < PLAYERS; i += 1) players.push(await join(`p${i}`));
  check(players.every((p) => p.joined), 'every player was seated');
  const slots = players.flatMap((p) => p.slots);
  check(new Set(slots).size === slots.length, `distinct slots ${JSON.stringify(slots)}`);
  const leader = players[0];
  await waitFor(() => leader.lobby && leader.lobby.slots.length === PLAYERS, 5000, 'lobby to list every player');
  check(leader.lobby?.leaderSlot === 0, 'first joiner is the leader');
  if (MODE !== 'cooperative') {
    leader.command('setMode', { mode: MODE });
    await waitFor(() => leader.lobby?.mode === MODE, 3000, `lobby mode to become ${MODE}`);
  }
  players.forEach((p) => p.startInput());
  leader.command('start');
  await waitFor(() => players.every((p) => p.snaps > 0), 20000, 'snapshots to start for everyone');
  players.forEach((p) => { p.snaps = 0; p.bytes = 0; p.firstAt = null; p.baseline(); });
  await sleep(SECONDS * 1000);
  for (const p of players) {
    const span = (p.tLast - p.firstAt) / 1000;
    say(`[${p.name}] ${p.snaps} snapshots in ${span.toFixed(1)}s = ${(p.snaps / span).toFixed(1)} Hz, ${(p.bytes / span / 1024).toFixed(0)} KB/s, tick regressions ${p.regressions}; states ${[...p.states]}; types ${[...p.types]}`);
    check(p.snaps >= SECONDS * 5, `${p.name}: enough snapshots (${p.snaps})`);
    check(p.regressions === 0, `${p.name}: ticks monotonic`);
    check(p.moved(p.slots[0]) > 5, `${p.name}: ship responded to input (${p.moved(p.slots[0]).toFixed(0)}px)`);
    // The one-shot effects: these ships fire constantly, so real shot sounds must show up.
    const repeats = [...p.eventSeen.values()];
    say(`[${p.name}] terrain: ${p.wrecksMax} wreck(s)${p.wreckSample ? ' ' + JSON.stringify(p.wreckSample) : ''}`);
    say(`[${p.name}] effects: ${p.eventSeen.size} distinct events, kinds ${[...p.eventKinds]}, sounds ${[...p.sfxSeen]}, music ${[...p.musicSeen]}`);
    check(p.sfxSeen.has('shot'), `${p.name}: the firing was announced as a 'shot' sound effect`);
    check(repeats.length > 0 && Math.max(...repeats) <= 3, `${p.name}: no effect repeats more than 3 times (max ${Math.max(0, ...repeats)})`);
    check(repeats.length > 0 && Math.min(...repeats) >= 1 && repeats.filter((n) => n >= 2).length > 0, `${p.name}: effects are repeated for loss tolerance`);
    check(p.idsAscending, `${p.name}: event ids arrive in order`);
    check(p.musicSeen.size === 1 && p.musicSeen.has('gameplay'), `${p.name}: the snapshot names the stage music (${[...p.musicSeen]})`);
  }
  players.forEach((p) => p.close());
}

async function scenarioLobby() {
  say(`lobby: rules scenario -> ${URL_} (needs returnToLobbyDelayMs small, e.g. 1000, no password)`);
  const a = await join('A'); const b = await join('B');
  say('1. two players join');
  check(a.slots[0] === 0 && b.slots[0] === 1, `slots 0 and 1 (got ${a.slots}, ${b.slots})`);
  await waitFor(() => b.lobby?.slots.length === 2, 5000, 'B sees both players');
  check(b.lobby?.leaderSlot === 0, 'A (first joiner) is the leader');

  say('2. a non-leader cannot start or change the mode');
  b.command('start'); b.command('setMode', { mode: 'competitive' });
  await sleep(1500);
  check(b.lobby?.status === 'lobby' && b.lobby?.mode === 'cooperative', 'lobby unchanged after B\'s commands');
  check(a.snaps === 0 && b.snaps === 0, 'no match started');

  say('3. the leader changes the mode');
  a.command('setMode', { mode: 'competitive' });
  await waitFor(() => b.lobby?.mode === 'competitive', 3000, 'B to see competitive');
  check(b.lobby?.mode === 'competitive', 'mode is competitive for everyone');

  say('4. the leader leaves -> leadership passes on');
  a.close();
  await waitFor(() => b.lobby?.leaderSlot === 1, 20000, 'B to become leader');
  check(b.lobby?.leaderSlot === 1 && b.lobby.slots.length === 1, 'B leads alone');
  b.command('start');
  await sleep(1200);
  check(b.lobby?.status === 'lobby', 'competitive refuses to start with a single player');

  say('5. a new player takes the freed slot but is not the leader');
  const c = await join('C');
  check(c.slots[0] === 0, `C reuses slot 0 (got ${c.slots})`);
  await waitFor(() => b.lobby?.slots.length === 2, 5000, 'lobby to list two players');
  check(b.lobby?.leaderSlot === 1 && JSON.stringify(b.lobby?.slots) === '[1,0]', `leader stays B, join order [1,0] (got ${JSON.stringify(b.lobby?.slots)})`);

  say('6. the new leader starts the match; input is only honoured for the sender\'s own slot');
  b.startInput(); c.startInput([0], 1); // C's input all claims slot 1 (B's) - must be ignored
  b.command('start');
  await waitFor(() => b.snaps > 5 && c.snaps > 5, 20000, 'snapshots for B and C');
  check(b.lobby?.status === 'inMatch', 'lobby reports inMatch');
  await sleep(2500);
  check(b.moved(1) > 5, `B's ship moved on B's input (${b.moved(1).toFixed(0)}px)`);
  check(c.moved(0) < 5, `C's ship did NOT move on input that claimed B's slot (${c.moved(0).toFixed(0)}px)`);
  c.baseline(); c.startInput(); // now honest
  await sleep(2500);
  check(c.moved(0) > 5, `C's ship moves once C sends input for its own slot (${c.moved(0).toFixed(0)}px)`);

  say('7. a joiner during a match is turned away');
  const d = await join('D');
  check(d.reject?.reason === 'matchInProgress' && !d.joined, `D rejected with matchInProgress (got ${JSON.stringify(d.reject)})`);
  d.close();

  say('8. everyone leaves -> match ends -> lobby reopens');
  b.close(); c.close();
  let e = null;
  const t0 = performance.now();
  while (performance.now() - t0 < 40000) {
    const probe = await join('E');
    if (probe.joined) { e = probe; break; }
    probe.close();
    await sleep(1000);
  }
  if (check(!!e, 'a new player could join again after the match ended')) {
    await waitFor(() => e.lobby, 5000, 'E to receive the lobby state');
    check(e.slots[0] === 0, 'E gets slot 0');
    check(e.lobby?.status === 'lobby' && e.lobby?.leaderSlot === 0, 'E leads a fresh lobby');
    check(e.lobby?.mode === 'cooperative' && e.joined.mode === 'cooperative', 'mode reset to the default once the lobby emptied');
    e.close();
  }
}

async function scenarioSession() {
  if (PASSWORD === '') { check(false, 'this scenario needs the server\'s password: pass --password=<it> (the server must have one set)'); return; }
  say(`session: join checks, status, two-player PC, reconnect -> ${URL_} (needs the server's password passed as --password, reconnectGraceMs 3000, returnToLobbyDelayMs ~1000)`);

  say('1. status query over the signaling socket alone');
  const st = await queryStatus();
  check(!!st && st.type === 'debris-status-reply', 'server answers a status query');
  check(st?.passwordRequired === true && st?.status === 'lobby' && st?.players.current === 0 && st?.players.max === 4, `status: password required, lobby, 0/4 (got ${JSON.stringify(st)})`);
  check(st?.protocolVersion === PROTOCOL_VERSION, `status carries protocol version ${PROTOCOL_VERSION}`);

  say('2. bad joins are turned away without being seated');
  const noPw = await join('noPw', { password: '' });
  check(noPw.reject?.reason === 'badPassword', `no password -> badPassword (got ${JSON.stringify(noPw.reject)})`);
  const badPw = await join('badPw', { password: 'nope' });
  check(badPw.reject?.reason === 'badPassword', 'wrong password -> badPassword');
  const oldVer = await join('oldVer', { password: PASSWORD, protocolVersion: 1 });
  check(oldVer.reject?.reason === 'wrongVersion', 'old protocol version -> wrongVersion');
  const garbage = new Player('garbage'); await garbage.connect(); garbage.sendRaw('{"type":"hello"}');
  await waitFor(() => garbage.reject, 5000, 'garbage first message to be rejected');
  check(garbage.reject?.reason === 'badRequest', 'a first message that is not a join -> badRequest');
  const badLocal = await join('badLocal', { password: PASSWORD, localPlayers: 3 });
  check(badLocal.reject?.reason === 'badRequest', 'localPlayers 3 -> badRequest');
  const noInitials = new Player('noInitials'); await noInitials.connect();
  noInitials.reliable.send(JSON.stringify({ type: 'debris-join', protocolVersion: PROTOCOL_VERSION, password: PASSWORD, localPlayers: 1 }));
  await waitFor(() => noInitials.reject, 5000, 'a join without initials to be rejected');
  check(noInitials.reject?.reason === 'badRequest', 'a join without initials -> badRequest');
  const badInitials = await join('badInitials', { password: PASSWORD, initials: ['a1'] });
  check(badInitials.reject?.reason === 'badRequest', 'initials that are not three capital letters -> badRequest');
  const wrongCount = await join('wrongCount', { password: PASSWORD, localPlayers: 2, initials: ['ABC'] });
  check(wrongCount.reject?.reason === 'badRequest', 'one set of initials for two players -> badRequest');
  [noPw, badPw, oldVer, garbage, badLocal, noInitials, badInitials, wrongCount].forEach((p) => p.close());
  await sleep(500);
  const st2 = await queryStatus();
  check(st2?.players.current === 0, 'none of them took a seat');

  say('3. a PC with two local players takes two slots');
  const a = await join('A', { password: PASSWORD, localPlayers: 2 });
  check(a.joined && JSON.stringify(a.slots) === '[0,1]', `A seated in slots [0,1] (got ${JSON.stringify(a.slots)})`);
  check(typeof a.token === 'string' && a.token.length === 32, 'A got a 32-character token');
  const b = await join('B', { password: PASSWORD });
  check(JSON.stringify(b.slots) === '[2]', `B seated in slot [2] (got ${JSON.stringify(b.slots)})`);
  await waitFor(() => b.lobby?.slots.length === 3, 5000, 'lobby to list three players');
  check(b.lobby?.leaderSlot === 0, 'A (first joiner, two players) is one leader');
  const st3 = await queryStatus();
  check(st3?.players.current === 3, `status shows 3/4 (got ${st3?.players.current})`);

  say('4. all-or-nothing seating: two players do not fit in one free slot');
  const big = await join('big', { password: PASSWORD, localPlayers: 2 });
  check(big.reject?.reason === 'full', `two-player PC with 1 slot free -> full (got ${JSON.stringify(big.reject)})`);
  big.close();

  say('5. leader starts; input works for both of A\'s slots and only for them');
  a.startInput(); // both of A's slots
  a.command('start');
  await waitFor(() => a.snaps > 5 && b.snaps > 5, 20000, 'snapshots for A and B');
  await sleep(2500);
  check(a.moved(0) > 5 && a.moved(1) > 5, `both of A's ships responded (${a.moved(0).toFixed(0)}px, ${a.moved(1).toFixed(0)}px)`);
  // A also claims B's slot; B sends nothing, so B's ship must stay put.
  a.startInput([0, 1, 2]);
  b.baseline();
  await sleep(2000);
  check(b.moved(2) < 5, `A cannot drive B's ship by claiming its slot (${b.moved(2).toFixed(0)}px)`);
  a.startInput();

  say('6. B drops mid-match, then comes back inside the window with its token');
  const bToken = b.token;
  b.close();
  await waitFor(() => a.lobby?.heldSlots.includes(2), 5000, 'lobby to show slot 2 as held');
  check(JSON.stringify(a.lobby?.heldSlots) === '[2]' && a.lobby.slots.includes(2), 'slot 2 is held, not released');
  const b2 = await join('B2', { password: PASSWORD, token: bToken });
  check(b2.joined?.resumed === true && b2.joined?.inMatch === true && JSON.stringify(b2.slots) === '[2]', `B2 resumed slot 2 inside a match (got ${JSON.stringify(b2.joined && { r: b2.joined.resumed, m: b2.joined.inMatch, s: b2.slots })})`);
  check(b2.token === bToken, 'the token stays the same');
  await waitFor(() => b2.snaps > 3, 10000, 'B2 to receive snapshots');
  await waitFor(() => (a.lobby?.heldSlots.length ?? 1) === 0, 5000, 'held slots to clear');
  check(a.lobby?.heldSlots.length === 0, 'slot 2 is no longer held');

  say('7. a quick reconnect takes the seat over from a still-open connection');
  const a2 = await join('A2', { password: PASSWORD, localPlayers: 2, token: a.token });
  check(a2.joined?.resumed === true && JSON.stringify(a2.slots) === '[0,1]', `A2 took over slots [0,1] (got ${JSON.stringify(a2.slots)})`);
  await waitFor(() => a2.snaps > 3, 10000, 'A2 to receive snapshots');
  a.close(); // the superseded connection closing must not release or hold anything
  await sleep(1500);
  check(a2.lobby?.slots.length === 3 && (a2.lobby?.heldSlots.length ?? 1) === 0, `all three seats intact (slots ${JSON.stringify(a2.lobby?.slots)}, held ${JSON.stringify(a2.lobby?.heldSlots)})`);

  say('8. a seat is released when the window closes without a return');
  const b2Token = b2.token;
  b2.close();
  await waitFor(() => a2.lobby?.heldSlots.includes(2), 5000, 'slot 2 held again');
  await waitFor(() => !a2.lobby?.slots.includes(2), 10000, 'slot 2 to be released after the grace period');
  check(JSON.stringify(a2.lobby?.slots) === '[0,1]', `slot 2 released, A's two slots remain (slots ${JSON.stringify(a2.lobby?.slots)})`);
  const late = await join('late', { password: PASSWORD, token: b2Token });
  check(late.reject?.reason === 'matchInProgress' && !late.joined, `a late token no longer works: turned away mid-match (got ${JSON.stringify(late.reject)})`);
  late.close(); a2.close();
}

async function scenarioScoring() {
  say(`scoring: one player (initials ${INITIALS}) spins and fires until it scores -> ${URL_}`);
  const p = await join('scorer', { password: PASSWORD });
  if (!check(!!p.joined, 'seated')) return;
  await waitFor(() => p.lobby, 5000, 'lobby state');
  p.startInput();
  p.command('start');
  // The snapshot carries every player's score: wait for ours to go above zero.
  let best = 0;
  const scoreOf = () => p.lastScore ?? 0;
  p.unreliable.addEventListener('message', (e) => {
    const s = JSON.parse(e.data);
    if (s.type !== 'debris-snapshot') return;
    const mine = s.players.find((pl) => pl.slotIndex === p.slots[0]);
    if (mine) { p.lastScore = mine.score; best = Math.max(best, mine.score); }
  });
  await waitFor(() => scoreOf() > 0, 90000, 'the ship to score a point by shooting something');
  say(`  scored ${best} so far`);
  check(best > 0, `the ship scored (${best})`);
  console.log(`__SCORE__ ${best}`);
  // Leave; the seat is held for the grace period, then released, and everyone being gone ends the match.
  p.close();
  await sleep(12000);
}

async function scenarioLeave() {
  say(`leave: a deliberate leave frees the seat at once; a drop holds it -> ${URL_} (needs reconnectGraceMs >= 3000)`);
  const a = await join('A', { password: PASSWORD });
  const b = await join('B', { password: PASSWORD });
  const c = await join('C', { password: PASSWORD });
  if (!check(!!(a.joined && b.joined && c.joined), 'three players seated')) return;
  await waitFor(() => a.lobby?.slots.length === 3, 5000, 'lobby to list three');
  [a, b, c].forEach((p) => p.startInput());
  a.command('start');
  await waitFor(() => a.snaps > 5 && b.snaps > 5 && c.snaps > 5, 20000, 'snapshots for all three');

  say('1. B chooses to leave');
  const t0 = performance.now();
  b.reliable.send(JSON.stringify({ type: 'debris-leave' }));
  await waitFor(() => !a.lobby?.slots.includes(b.slots[0]), 3000, 'B\'s slot to leave the lobby');
  const took = performance.now() - t0;
  check(!a.lobby?.slots.includes(b.slots[0]), `B's seat is gone from the lobby (${took.toFixed(0)}ms after the message)`);
  check((a.lobby?.heldSlots.length ?? 1) === 0, 'it is released, not held for the reconnect window');
  check(took < 2000, `and promptly - far faster than the 3s a dropped player is held (${took.toFixed(0)}ms)`);
  b.close();
  const tickAfterLeave = a.lastTick; await sleep(2000);
  check(a.lastTick > tickAfterLeave + 30, `the match keeps running for the others after a leave (tick ${tickAfterLeave} -> ${a.lastTick})`);
  a.baseline(); await sleep(1500);
  check(a.moved(a.slots[0]) > 1, 'and the remaining ship still answers input');

  say('2. C just drops: that one IS held');
  c.close();
  await waitFor(() => a.lobby?.heldSlots.includes(c.slots[0]), 5000, 'C\'s slot to be held');
  check(a.lobby?.heldSlots.includes(c.slots[0]) && a.lobby.slots.includes(c.slots[0]), 'a dropped connection keeps its seat, shown as held');

  say('3. the leaver cannot come back with its token');
  const back = await join('B2', { password: PASSWORD, token: b.token });
  check(!back.joined?.resumed, 'a token from a seat that was given up does not resume it');
  back.close(); a.close();
}

async function scenarioLimits() {
  say(`limits: abuse limits and the idle leader -> ${URL_} (needs gameplay.idleLeaderMs ~3000, default limits, no other clients)`);
  const rawSocket = (url) => new Promise((resolve) => {
    const ws = new WebSocket(url);
    const info = { ws, code: null };
    ws.onclose = (e) => { info.code = e.code; };
    ws.onopen = () => resolve(info);
    ws.onerror = () => resolve(info);
  });

  say('1. a message flood is cut off, and the server still serves a normal player afterwards');
  const flooder = await rawSocket(URL_);
  for (let i = 0; i < 400; i += 1) { try { flooder.ws.send('{"junk":' + i + '}'); } catch (e) { break; } }
  await waitFor(() => flooder.code !== null, 5000, 'the flooding socket to be closed');
  check(flooder.code === 1008, `the flooder was closed for rate limiting (code ${flooder.code})`);

  say('2. more sockets from one address than the cap are refused');
  const socks = [];
  for (let i = 0; i < 12; i += 1) socks.push(await rawSocket(URL_));
  await sleep(500);
  const refused = socks.filter((s) => s.code === 1013).length;
  check(refused >= 3, `sockets over the per-address cap were refused (${refused} of 12 got code 1013)`);
  socks.forEach((s) => s.ws.close());
  await sleep(500);

  say('3. an idle leader hands the lead to the next player');
  const a = await join('A', { password: PASSWORD }); const b = await join('B', { password: PASSWORD });
  if (!check(!!(a.joined && b.joined), 'two players seated')) return;
  await waitFor(() => b.lobby?.slots.length === 2, 5000, 'B sees both players');
  check(b.lobby?.leaderSlot === 0, 'A leads at first');
  b.command('start'); await sleep(800);
  check(b.lobby?.status === 'lobby', 'B cannot start while A leads');
  await waitFor(() => b.lobby?.leaderSlot === 1, 20000, 'the lead to pass to B');
  check(b.lobby?.leaderSlot === 1 && a.lobby?.leaderSlot === 1, 'B now leads (both see it)');
  check(a.lobby?.slots.length === 2, 'A is still seated');
  a.command('start'); await sleep(800);
  check(a.lobby?.status === 'lobby', 'A, no longer leader, cannot start');
  b.startInput(); a.startInput();
  b.command('start');
  await waitFor(() => b.snaps > 5, 20000, 'B to start a match as the new leader');
  check(b.snaps > 5, 'B started the match');
  a.close(); b.close();
}

async function scenarioBot() {
  const leaveAfter = Number(q.get('leaveAfter') || 3000);
  const bot = await join('bot', { password: PASSWORD });
  say(`bot: ${bot.joined ? `seated in slot ${bot.slots}` : `rejected ${JSON.stringify(bot.reject)}`}`);
  if (!bot.joined) return check(false, 'bot was seated');
  const started = await waitFor(() => bot.snaps > 0, 60000, 'the match to start');
  if (!started) return;
  await sleep(leaveAfter);
  say(`bot: leaving ${leaveAfter}ms into the match`);
  bot.close();
}

(async () => {
  try {
    if (SCENARIO === 'bot') await scenarioBot();
    else if (SCENARIO === 'scoring') await scenarioScoring();
    else if (SCENARIO === 'limits') await scenarioLimits();
    else if (SCENARIO === 'leave') await scenarioLeave();
    else if (SCENARIO === 'lobby') await scenarioLobby();
    else if (SCENARIO === 'session') await scenarioSession();
    else await scenarioPlay();
  } catch (err) { check(false, `unexpected error: ${err && err.stack || err}`); }
  say(failures.length === 0 ? 'PASS' : `FAIL (${failures.length})`);
  console.log(`__EXIT__ ${failures.length === 0 ? 0 : 1}`);
})();
setTimeout(() => { say('FAIL: scenario exceeded 150s'); console.log('__EXIT__ 1'); }, 150000);
</script>
